name: Bug report
description: Report a reproducible plugin problem
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove API keys, vehicle IDs, VINs, locations, and account details from all logs.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: homebridge-version
    attributes:
      label: Homebridge version
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start Homebridge…
        2. Wait for…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Enable verbose logging if useful, then remove all sensitive values.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed API keys, vehicle IDs, VINs, locations, and account details.
          required: true
